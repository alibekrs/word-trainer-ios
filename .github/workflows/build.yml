name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: >
          xcodebuild -project WordTrainer.xcodeproj -target WordTrainer -configuration Release
          -sdk iphoneos SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload && cp -R build/Release-iphoneos/WordTrainer.app Payload/
          test -f Payload/WordTrainer.app/index.html
          zip -qr WordTrainer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WordTrainer-ipa
          path: WordTrainer.ipa
