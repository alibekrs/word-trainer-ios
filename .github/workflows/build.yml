name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" || true
          xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: UI tour on simulator
        timeout-minutes: 25
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')]
          print(next((x for x in c if 'Pro Max' in x['name']), c[-1])['udid'])")
          echo "simulator: $DEV"
          xcodebuild test -project WordTrainer.xcodeproj -scheme WordTrainer -destination "id=$DEV" \
            -resultBundlePath tour.xcresult CODE_SIGNING_ALLOWED=NO | xcbeautify || xcodebuild test -project WordTrainer.xcodeproj -scheme WordTrainer -destination "id=$DEV" -resultBundlePath tour2.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|failed|Failing|XCTAssert" | head -60
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p shots
          for r in tour.xcresult tour2.xcresult; do [ -d "$r" ] && xcrun xcresulttool export attachments --path "$r" --output-path shots && break; done
          ls shots | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tour
          path: shots
      - name: Device build
        run: |
          xcodebuild -project WordTrainer.xcodeproj -target WordTrainer -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -5
          mkdir Payload && cp -R build/Release-iphoneos/WordTrainer.app Payload/
          test -f Payload/WordTrainer.app/ngsl.txt
          zip -qr WordTrainer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WordTrainer-ipa
          path: WordTrainer.ipa
