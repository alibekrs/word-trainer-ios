<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Тренажёр слов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Liquid glass: one centered column of frosted panels floating over slowly drifting color blobs. */
:root{
  --bg:#dde7f4; --fg:#0f1a2b; --muted:rgba(15,26,43,.58);
  --b1:#7dd3fc; --b2:#c4b5fd; --b3:#fda4af; --b4:#86efac;
  --glass:rgba(255,255,255,.42); --glass2:rgba(255,255,255,.14); --edge:rgba(255,255,255,.75);
  --well:rgba(255,255,255,.38); --shadow:rgba(40,60,100,.18);
  --accent:#0a84ff; --good:#1fa64a; --bad:#e5342a;
  --font:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070b18; --fg:#f2f5fb; --muted:rgba(242,245,251,.6);
  --b1:#0284c7; --b2:#7c3aed; --b3:#db2777; --b4:#059669;
  --glass:rgba(255,255,255,.12); --glass2:rgba(255,255,255,.03); --edge:rgba(255,255,255,.24);
  --well:rgba(0,0,0,.22); --shadow:rgba(0,0,0,.45);
  --accent:#409cff; --good:#30d158; --bad:#ff6961; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070b18; --fg:#f2f5fb; --muted:rgba(242,245,251,.6);
  --b1:#0284c7; --b2:#7c3aed; --b3:#db2777; --b4:#059669;
  --glass:rgba(255,255,255,.12); --glass2:rgba(255,255,255,.03); --edge:rgba(255,255,255,.24);
  --well:rgba(0,0,0,.22); --shadow:rgba(0,0,0,.45);
  --accent:#409cff; --good:#30d158; --bad:#ff6961; color-scheme:dark}

html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:600 16px/1.5 var(--font);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px;
  -webkit-tap-highlight-color:transparent}

/* living background */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.sky i:nth-child(1){background:var(--b1);top:-20vmax;left:-15vmax}
.sky i:nth-child(2){background:var(--b2);top:10vmax;right:-25vmax;animation-delay:-6s}
.sky i:nth-child(3){background:var(--b3);bottom:-25vmax;left:-10vmax;animation-delay:-12s}
.sky i:nth-child(4){background:var(--b4);bottom:-15vmax;right:-15vmax;width:40vmax;height:40vmax;animation-delay:-3s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

main{max-width:560px;margin:0 auto;display:grid;gap:18px}
header{padding:4px 6px}
h1{font-weight:900;font-size:2.2rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-weight:800;font-size:1.1rem;margin:0}
.sub{color:var(--muted);margin:2px 0 0}

/* the glass */
.glass{position:relative;isolation:isolate;
  background:linear-gradient(145deg,var(--glass),var(--glass2));
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border:1px solid var(--edge);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 -1px 1px rgba(255,255,255,.08),0 24px 48px -12px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 60% at 15% 0%,rgba(255,255,255,.45),transparent 55%)}
.card{border-radius:30px;padding:20px;display:grid;gap:14px}

textarea,input[type=text]{font:inherit;color:var(--fg);background:var(--well);border:1px solid var(--edge);border-radius:18px;
  padding:12px 14px;width:100%;box-sizing:border-box;box-shadow:inset 0 2px 6px rgba(0,0,0,.08);transition:border-color .2s,box-shadow .2s}
textarea{min-height:92px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--muted)}
textarea:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 2px 6px rgba(0,0,0,.08),0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}

button{font:800 1rem var(--font);cursor:pointer;color:var(--fg);border-radius:999px;padding:14px 20px;letter-spacing:.01em;
  transition:transform .15s,filter .15s}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.45;cursor:default;transform:none}
.primary{color:#fff;border:1px solid rgba(255,255,255,.5);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 24px -8px var(--accent)}
.clear{border:1px solid var(--edge)}
.small{padding:8px 14px;font-size:.85rem}
.icon{padding:0;width:40px;height:40px;flex:0 0 auto;font-size:1.05rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 auto}
.between{justify-content:space-between}

.words{display:grid;gap:8px}
.word{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.word input{padding:9px 12px;border-radius:14px}
.del{background:transparent;border:none;color:var(--muted);padding:6px 10px;font-size:1.3rem}
.status{color:var(--muted);font-size:.9rem;min-height:1.2em;margin:0}
.badge{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}

.bar{height:14px;border-radius:99px;background:var(--well);border:1px solid var(--edge);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;width:0;transition:width .4s cubic-bezier(.3,1.4,.5,1);
  background:linear-gradient(90deg,var(--b1),var(--accent));box-shadow:0 0 12px var(--accent)}
.prompt{font-size:2.1rem;font-weight:900;text-align:center;margin:6px 0 0;overflow-wrap:anywhere;text-wrap:balance}
.speak{justify-self:center}
#answer{font-size:1.35rem;text-align:center;padding:14px}
.fb{border-radius:22px;padding:14px 16px;font-weight:800;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.fb.ok{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.fb.no{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.fb b{font-size:1.25rem;letter-spacing:.04em}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.big{font-size:3.4rem;font-weight:900;text-align:center;margin:0;letter-spacing:-.03em}
.miss{margin:4px 0}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media (max-width:420px){.word{grid-template-columns:1fr auto}.word .tr{grid-column:1/2}h1{font-size:1.9rem}}
</style>

<div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main>
  <header>
    <h1>Тренажёр слов</h1>
    <p class="sub">Впиши слова — я переведу, а потом проверю, как ты их пишешь.</p>
  </header>

  <!-- Editor -->
  <section id="edit" class="card glass">
    <label for="newWords"><h2>Добавить слова</h2></label>
    <textarea id="newWords" placeholder="по одному в строке или через запятую&#10;necessary, rhythm, separate"></textarea>
    <button id="addBtn" class="primary">Добавить и перевести</button>
    <p id="status" class="status"></p>
    <div class="row between">
      <h2 id="count"></h2>
      <button id="clearBtn" class="clear small">Очистить</button>
    </div>
    <p class="badge" id="exampleNote" hidden>Это пример — нажми «Очистить» и добавь свои</p>
    <div class="words" id="words"></div>
    <button id="startBtn" class="primary">Начать тренировку</button>
  </section>

  <!-- Quiz -->
  <section id="quiz" class="card glass" hidden>
    <div class="row">
      <button id="quitBtn" class="clear icon" aria-label="Выйти">✕</button>
      <div class="bar grow"><i id="bar"></i></div>
    </div>
    <p class="badge" style="text-align:center">Напиши по-английски</p>
    <p id="prompt" class="prompt"></p>
    <button id="speakBtn" class="clear small speak">🔊 Послушать</button>
    <input id="answer" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Ответ">
    <div id="fb" class="fb" hidden></div>
    <button id="checkBtn" class="primary">Проверить</button>
  </section>

  <!-- Result -->
  <section id="result" class="card glass" hidden>
    <p class="big" id="score"></p>
    <p class="sub" style="text-align:center" id="scoreText"></p>
    <div id="mistakes"></div>
    <div class="row">
      <button id="againBtn" class="primary grow">Ещё раз</button>
      <button id="mistakesBtn" class="primary grow">Только ошибки</button>
      <button id="backBtn" class="clear grow">К списку</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const EXAMPLE = [
  {w:"necessary",t:"необходимый"},{w:"rhythm",t:"ритм"},{w:"separate",t:"отдельный"},
  {w:"definitely",t:"определённо"},{w:"accommodate",t:"вмещать, размещать"}];
let words, isExample = false;
try { words = JSON.parse(localStorage.getItem("words")); } catch {}
if (!Array.isArray(words)) { words = EXAMPLE.map(x => ({...x})); isExample = true; }
const save = () => { try { localStorage.setItem("words", JSON.stringify(words)); } catch {} };
const norm = s => s.trim().toLowerCase().replace(/\s+/g, " ").replace(/[’`]/g, "'");

// ---------- editor ----------
function renderList() {
  $("count").textContent = `Мои слова: ${words.length}`;
  $("exampleNote").hidden = !isExample;
  const box = $("words"); box.textContent = "";
  words.forEach((x, i) => {
    const row = document.createElement("div"); row.className = "word";
    const w = Object.assign(document.createElement("input"), {type:"text", value:x.w, id:"w"+i});
    const t = Object.assign(document.createElement("input"), {type:"text", value:x.t, id:"t"+i, className:"tr", placeholder:"перевод…"});
    w.setAttribute("aria-label","Слово"); t.setAttribute("aria-label","Перевод");
    w.oninput = () => { x.w = w.value; isExample = false; save(); };
    t.oninput = () => { x.t = t.value; isExample = false; save(); };
    const d = Object.assign(document.createElement("button"), {className:"del", textContent:"×", title:"Удалить"});
    d.setAttribute("aria-label", "Удалить " + x.w);
    d.onclick = () => { words.splice(i, 1); save(); renderList(); };
    row.append(w, t, d); box.append(row);
  });
  $("startBtn").disabled = !words.some(x => x.w.trim());
}

async function translate(list) {
  const sample = await (window.claude?.use("sample") ?? null);
  $("status").textContent = "Перевожу…";
  if (!sample) return translateFree(list);
  try {
    const res = await sample.json(
      "Translate each English word or phrase into Russian. Give the most common meaning, short (1-3 words). " +
      "Reply with ONLY a JSON object mapping each input exactly as given to its Russian translation.\n" +
      JSON.stringify(list.map(x => x.w)), {modelTier:"quick"});
    list.forEach(x => { if (!x.t && res && typeof res[x.w] === "string") x.t = res[x.w]; });
    save(); renderList();
    $("status").textContent = "Готово. Проверь перевод — его можно исправить.";
  } catch (e) {
    $("status").textContent = e && e.code === "not_granted"
      ? "Автоперевод выключен — впиши перевод вручную."
      : "Не получилось перевести. Попробуй ещё раз или впиши вручную.";
  }
}

// Outside claude.ai (the iPhone app): free MyMemory API, no key needed.
async function translateFree(list) {
  let fail = 0;
  await Promise.all(list.map(async x => {
    try {
      const r = await fetch("https://api.mymemory.translated.net/get?langpair=en|ru&q=" + encodeURIComponent(x.w));
      const j = await r.json(), t = j?.responseData?.translatedText;
      if (j?.responseStatus == 200 && t) { if (!x.t) x.t = t; } else fail++;
    } catch { fail++; }
  }));
  save(); renderList();
  $("status").textContent = fail ? `Не перевелось слов: ${fail} — впиши вручную.` : "Готово. Проверь перевод — его можно исправить.";
}

$("addBtn").onclick = () => {
  const have = new Set(words.map(x => norm(x.w)));
  const fresh = $("newWords").value.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean)
    .filter(s => !have.has(norm(s)) && have.add(norm(s))).map(w => ({w, t:""}));
  if (!fresh.length) { $("status").textContent = "Нет новых слов."; return; }
  if (isExample) { words = []; isExample = false; }
  words.push(...fresh); $("newWords").value = ""; save(); renderList();
  translate(fresh);
};
$("clearBtn").onclick = () => { words = []; isExample = false; save(); renderList(); };

// ---------- quiz ----------
let queue, total, firstTry, wrong, cur, checked;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const show = id => ["edit", "quiz", "result"].forEach(s => $(s).hidden = s !== id);

function start(list) {
  queue = shuffle(list.filter(x => x.w.trim()).map(x => ({...x})));
  if (!queue.length) return;
  total = queue.length; wrong = new Map(); firstTry = 0;
  show("quiz"); next();
}
function next() {
  if (!queue.length) return finish();
  cur = queue[0]; checked = false;
  $("bar").style.width = (100 * (total - queue.length) / total) + "%";
  $("prompt").textContent = cur.t.trim() || "🔊 (послушай слово)";
  $("answer").value = ""; $("answer").disabled = false; $("answer").focus();
  $("fb").hidden = true; $("checkBtn").textContent = "Проверить";
  if (!cur.t.trim()) speak();
}
function check() {
  if (checked) return next();
  const a = $("answer").value; if (!a.trim()) return;
  checked = true; $("answer").disabled = true; queue.shift();
  const ok = norm(a) === norm(cur.w), fb = $("fb");
  fb.hidden = false; fb.className = "fb " + (ok ? "ok" : "no"); fb.textContent = "";
  if (ok) {
    fb.textContent = "Верно! 🎉";
    if (!wrong.has(cur.w)) firstTry++;
  } else {
    wrong.set(cur.w, cur);
    queue.splice(Math.min(queue.length, 3), 0, cur); // shortcut: wrong word comes back ~3 cards later
    const b = document.createElement("b"); b.textContent = cur.w;
    fb.append("Правильно: ", b);
  }
  $("checkBtn").textContent = "Дальше"; $("checkBtn").focus();
}
function finish() {
  $("bar").style.width = "100%"; show("result");
  $("score").textContent = `${firstTry} / ${total}`;
  $("scoreText").textContent = wrong.size ? "с первой попытки. Слова с ошибками:" : "Без единой ошибки! 🌟";
  const m = $("mistakes"); m.textContent = "";
  wrong.forEach(x => { const p = document.createElement("p"); p.className = "miss";
    const b = document.createElement("b"); b.textContent = x.w; p.append(b, " — " + x.t); m.append(p); });
  $("mistakesBtn").hidden = !wrong.size;
}

// ---------- speech ----------
let tts = null; window.claude?.use("tts").then(t => tts = t).catch(() => {});
function speak() {
  if (tts) return tts.speak(cur.w, {language:"en", rate:.85}).catch(() => {});
  try { const u = new SpeechSynthesisUtterance(cur.w); u.lang = "en-US"; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch {}
}

$("speakBtn").onclick = speak;
$("checkBtn").onclick = check;
$("answer").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
$("checkBtn").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
$("startBtn").onclick = () => start(words);
$("againBtn").onclick = () => start(words);
$("mistakesBtn").onclick = () => start([...wrong.values()]);
$("backBtn").onclick = $("quitBtn").onclick = () => { show("edit"); renderList(); };
renderList();
</script>

</body></html>
